name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Biome check (lint + format)
        run: npm run check

      - name: TypeScript typecheck
        run: npm run typecheck
